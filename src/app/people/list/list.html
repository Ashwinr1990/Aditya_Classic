<h2>People</h2>

<div style="display: flex; justify-content: flex-end; margin-bottom: 1rem; animation: fadeInDown 0.7s cubic-bezier(.4,2,.6,1);">
	@if (auth.canEdit()) {
	<button (click)="openDialog()" class="acmt-btn" style="border-radius: 2rem;">Add Person</button>
	}
</div>

<!-- Modal Dialog -->
<div *ngIf="showDialog" class="modal-backdrop" style="animation: fadeIn 0.4s cubic-bezier(.4,2,.6,1);">
	<div class="modal-content" style="animation: popIn 0.5s cubic-bezier(.4,2,.6,1);">
		<h3>{{ editIndex === null ? 'Add Person' : 'Edit Person' }}</h3>
		<form (ngSubmit)="savePerson()" #personForm="ngForm">
			<div style="margin-bottom: 1rem;">
				<label>Name<br>
					<input type="text" name="name" [(ngModel)]="newPerson.name" required style="width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #ccc;">
				</label>
			</div>
			<div style="margin-bottom: 1rem;">
				<label>House Number<br>
					<input type="text" name="unit" [(ngModel)]="newPerson.unit" required style="width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #ccc;">
				</label>
			</div>
			<div style="margin-bottom: 1rem;">
				<label>Email <span style="color: #888; font-weight: normal;">(optional)</span><br>
					<input type="email" name="email" [(ngModel)]="newPerson.email" email autocomplete="off" placeholder="name@example.com" style="width: 100%; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #ccc;">
				</label>
			</div>
			<p *ngIf="dialogError" style="color: #c62828; font-weight: 600; margin: 0 0 1rem;">{{ dialogError }}</p>
			<div style="display: flex; gap: 1rem;">
				<button type="submit" [disabled]="personForm.invalid" style="padding: 0.5rem 1.5rem; border-radius: 2rem; background: #1976d2; color: #fff; border: none; font-weight: 500; cursor: pointer;">{{ editIndex === null ? 'Add' : 'Save' }}</button>
				<button type="button" (click)="closeDialog()" style="padding: 0.5rem 1.5rem; border-radius: 2rem; background: #eee; color: #333; border: none; font-weight: 500; cursor: pointer;">Cancel</button>
			</div>
		</form>
	</div>
</div>

<style>
.modal-backdrop {
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: rgba(0,0,0,0.2);
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 1000;
}
.modal-content {
	background: #fff;
	padding: 2rem;
	border-radius: 1rem;
	box-shadow: 0 4px 24px #0002;
	min-width: 320px;
}
</style>

<table class="acmt-table" style="animation: fadeIn 0.7s cubic-bezier(.4,2,.6,1);">
	<thead style="background: #1976d2; color: #fff;">
		<tr>
			<th style="padding: 0.75rem; text-align: left;">Name</th>
			<th style="padding: 0.75rem; text-align: left;">Flat/Unit</th>
			<th style="padding: 0.75rem; text-align: left;">Email</th>
			@if (auth.canEdit()) {
			<th style="padding: 0.75rem; text-align: center;">Actions</th>
			}
		</tr>
	</thead>
	<tbody>
		<tr *ngFor="let person of people; let idx = index" style="border-bottom: 1px solid #eee;">
			<td style="padding: 0.75rem;">{{ person.name }}</td>
			<td style="padding: 0.75rem;">{{ person.unit }}</td>
			<td style="padding: 0.75rem; word-break: break-all;">
				@if (person.email) {
				<a [href]="'mailto:' + person.email" style="color: #1976d2;">{{ person.email }}</a>
				} @else {
				<span style="color: #aaa;">—</span>
				}
			</td>
			@if (auth.canEdit()) {
			<td style="padding: 0.5rem; text-align: center; white-space: nowrap;">
				<button (click)="openEdit(idx)" style="padding: 0.25rem 1rem; border-radius: 1rem; background: #1976d2; color: #fff; border: none; font-weight: 500; cursor: pointer; margin-right: 0.5rem;">Edit</button>
				<button (click)="deletePerson(idx)" style="padding: 0.25rem 1rem; border-radius: 1rem; background: #c62828; color: #fff; border: none; font-weight: 500; cursor: pointer;">Delete</button>
			</td>
			}
		</tr>
		<tr *ngIf="people.length === 0">
			<td [attr.colspan]="auth.canEdit() ? 4 : 3" style="padding: 1rem; text-align: center; color: #888;">No people added yet.</td>
		</tr>
	</tbody>
</table>
